name: Validate tutorial sources

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/validate_content.py"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/validate_content.py"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate active tutorial inventory
        run: python scripts/validate_content.py
