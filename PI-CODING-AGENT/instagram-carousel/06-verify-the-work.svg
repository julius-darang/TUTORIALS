<rect x="490" y="1361" width="14" height="3" fill="#41423e"/>
<rect x="516" y="1361" width="14" height="3" fill="#41423e"/>
<rect x="542" y="1361" width="14" height="3" fill="#41423e"/>
<rect x="568" y="1361" width="14" height="3" fill="#d77600"/>
<rect x="594" y="1361" width="14" height="3" fill="#41423e"/>
