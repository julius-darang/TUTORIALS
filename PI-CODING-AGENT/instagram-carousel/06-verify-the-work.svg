<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><title>verify-the-work</title><desc>Pi Coding Agent tutorial by Julius Darang. Slide 6 of 8. Editable vector artwork.</desc>
<rect x="0" y="0" width="1080" height="1440" fill="#131414" id="background"/>
<text id="series-label" x="88" y="79" font-family="JetBrains Mono" font-size="23" font-weight="400" fill="#d77600" text-anchor="start">PI / FIELD NOTES</text>
<text x="992" y="79" font-family="JetBrains Mono" font-size="21" font-weight="400" fill="#b6b5af" text-anchor="end">JULIUS DARANG</text>
<line x1="88" y1="117" x2="992" y2="117" stroke="#41423e" stroke-width="1.5"/>
<text x="88" y="190" font-family="JetBrains Mono" font-size="24" font-weight="400" fill="#d77600" text-anchor="start">04 / VERIFY</text>
<text x="88" y="295" font-family="STIX Two Text" font-size="90" font-weight="500" fill="#e8e7e3" text-anchor="start">The diff is</text>
<text x="88" y="391" font-family="STIX Two Text" font-size="90" font-weight="500" fill="#e8e7e3" text-anchor="start">part of the answer.</text>
<text x="88" y="478" font-family="STIX Two Text" font-size="37" font-weight="400" fill="#b6b5af" text-anchor="start">Read what changed. Run the project’s checks.</text>
<g id="shell-/-review">
<rect x="88" y="540" width="904" height="209" fill="#1c1e1d" stroke="#41423e" stroke-width="1.5"/>
<text x="116" y="580" font-family="JetBrains Mono" font-size="21" font-weight="400" fill="#b6b5af" text-anchor="start">SHELL / REVIEW</text>
<line x1="88" y1="602" x2="992" y2="602" stroke="#41423e" stroke-width="1.5"/>
<text x="116" y="650" font-family="JetBrains Mono" font-size="36" font-weight="400" fill="#e8e7e3" text-anchor="start">git diff</text>
<text x="116" y="696" font-family="JetBrains Mono" font-size="36" font-weight="400" fill="#e8e7e3" text-anchor="start">git diff --check</text>
</g>
<g id="note-01">
<text x="88" y="857" font-family="JetBrains Mono" font-size="24" font-weight="400" fill="#d77600" text-anchor="start">01</text>
<text x="159" y="857" font-family="STIX Two Text" font-size="42" font-weight="500" fill="#e8e7e3" text-anchor="start">Run the relevant tests.</text>
<text x="159" y="912" font-family="STIX Two Text" font-size="34" font-weight="400" fill="#b6b5af" text-anchor="start">Use the commands your project actually uses.</text>
</g>
<g id="note-02">
<text x="88" y="1011" font-family="JetBrains Mono" font-size="24" font-weight="400" fill="#d77600" text-anchor="start">02</text>
<text x="159" y="1011" font-family="STIX Two Text" font-size="42" font-weight="500" fill="#e8e7e3" text-anchor="start">Compare with the requirement.</text>
<text x="159" y="1066" font-family="STIX Two Text" font-size="34" font-weight="400" fill="#b6b5af" text-anchor="start">Did the change satisfy the acceptance criteria?</text>
</g>
<text x="88" y="1224" font-family="STIX Two Text" font-size="45" font-weight="400" fill="#d77600" text-anchor="start">Commit only what you understand.</text>
<g id="footer">
<line x1="88" y1="1321" x2="992" y2="1321" stroke="#41423e" stroke-width="1.5"/>
<text x="88" y="1375" font-family="JetBrains Mono" font-size="23" font-weight="400" fill="#b6b5af" text-anchor="start">@juliusdarang</text>
<text x="992" y="1375" font-family="JetBrains Mono" font-size="23" font-weight="400" fill="#b6b5af" text-anchor="end">06 / 08</text>
