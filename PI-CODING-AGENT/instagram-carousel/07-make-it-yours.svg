<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><title>make-it-yours</title><desc>Pi Coding Agent tutorial by Julius Darang. Slide 7 of 8. Editable vector artwork.</desc>
<rect x="0" y="0" width="1080" height="1440" fill="#131414" id="background"/>
<text id="series-label" x="88" y="79" font-family="JetBrains Mono" font-size="23" font-weight="400" fill="#d77600" text-anchor="start">PI / FIELD NOTES</text>
<text x="992" y="79" font-family="JetBrains Mono" font-size="21" font-weight="400" fill="#b6b5af" text-anchor="end">JULIUS DARANG</text>
<line x1="88" y1="117" x2="992" y2="117" stroke="#41423e" stroke-width="1.5"/>
<text x="88" y="190" font-family="JetBrains Mono" font-size="24" font-weight="400" fill="#d77600" text-anchor="start">05 / SHAPE THE WORKFLOW</text>
<text x="88" y="295" font-family="STIX Two Text" font-size="90" font-weight="500" fill="#e8e7e3" text-anchor="start">Stop repeating</text>
<text x="88" y="391" font-family="STIX Two Text" font-size="90" font-weight="500" fill="#e8e7e3" text-anchor="start">your project rules.</text>
<text x="88" y="478" font-family="STIX Two Text" font-size="39" font-weight="400" fill="#b6b5af" text-anchor="start">Put durable instructions in AGENTS.md.</text>
<g id="agents.md-/-example">
<rect x="88" y="545" width="904" height="335" fill="#1c1e1d" stroke="#41423e" stroke-width="1.5"/>
<text x="116" y="585" font-family="JetBrains Mono" font-size="21" font-weight="400" fill="#b6b5af" text-anchor="start">AGENTS.md / EXAMPLE</text>
<line x1="88" y1="607" x2="992" y2="607" stroke="#41423e" stroke-width="1.5"/>
<text x="116" y="655" font-family="JetBrains Mono" font-size="30" font-weight="400" fill="#e8e7e3" text-anchor="start"># Project rules</text>
<text x="116" y="701" font-family="JetBrains Mono" font-size="30" font-weight="400" fill="#e8e7e3" text-anchor="start"></text>
<text x="116" y="747" font-family="JetBrains Mono" font-size="30" font-weight="400" fill="#e8e7e3" text-anchor="start">- Run npm run check after edits.</text>
<text x="116" y="793" font-family="JetBrains Mono" font-size="30" font-weight="400" fill="#e8e7e3" text-anchor="start">- Do not edit generated files.</text>
<text x="116" y="839" font-family="JetBrains Mono" font-size="30" font-weight="400" fill="#e8e7e3" text-anchor="start">- Keep the public API stable.</text>
</g>
<g id="inside-pi-/-reload-rules">
<rect x="88" y="921" width="904" height="153" fill="#1c1e1d" stroke="#41423e" stroke-width="1.5"/>
<text x="116" y="961" font-family="JetBrains Mono" font-size="21" font-weight="400" fill="#b6b5af" text-anchor="start">INSIDE PI / RELOAD RULES</text>
<line x1="88" y1="983" x2="992" y2="983" stroke="#41423e" stroke-width="1.5"/>
<text x="116" y="1031" font-family="JetBrains Mono" font-size="35" font-weight="400" fill="#e8e7e3" text-anchor="start">/reload</text>
</g>
<text x="88" y="1162" font-family="STIX Two Text" font-size="35" font-weight="400" fill="#b6b5af" text-anchor="start">Next: turn a repeated procedure into a skill.</text>
<text x="88" y="1211" font-family="STIX Two Text" font-size="35" font-weight="400" fill="#b6b5af" text-anchor="start">Add an extension when you need custom behavior.</text>
<g id="footer">
<line x1="88" y1="1321" x2="992" y2="1321" stroke="#41423e" stroke-width="1.5"/>
<text x="88" y="1375" font-family="JetBrains Mono" font-size="23" font-weight="400" fill="#b6b5af" text-anchor="start">@juliusdarang</text>
<text x="992" y="1375" font-family="JetBrains Mono" font-size="23" font-weight="400" fill="#b6b5af" text-anchor="end">07 / 08</text>
